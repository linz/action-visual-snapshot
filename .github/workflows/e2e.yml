name: e2e
on:
  pull_request:
  push:
    branches:
      - master # Triggers on master to save the initial "base" snapshots
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies & build
        run: |
          npm ci
          npm run dist

      - name: Setup Mock Snapshots
        run: |
          mkdir -p /tmp/mock-snapshots/acceptance

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running on PR: using current branch mock snapshot"
            cp src/util/__fixtures__/imgs/current/acceptance/test.png /tmp/mock-snapshots/
          else
            echo "Running on push/master: using base branch mock snapshot"
            cp src/util/__fixtures__/imgs/base/acceptance/test.png /tmp/mock-snapshots/
          fi

      - name: Run Visual Snapshot Action
        id: visual-snapshots-diff
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          snapshot-path: /tmp/mock-snapshots
          artifact-name: e2e-test-snapshots
          action-name: E2E Test Snapshots
          results-path: /tmp/e2e-results

      - name: Verify Results
        if: github.event_name == 'pull_request'
        run: |
          # Add custom bash assertions here to verify the action produced the expected diff files
          echo "Checking if results were generated..."
          ls -la /tmp/e2e-results/visual-snapshots-results

          # Example: Fail the test if no diff index.html was generated
          if [ ! -f "/tmp/e2e-results/visual-snapshots-results/index.html" ]; then
            echo "Expected index.html was not generated!"
            exit 1
          fi
